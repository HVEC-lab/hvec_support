name: tests

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # The package is Windows-only, so the suite runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment (Python 3.13 from .python-version)
        run: uv sync --locked
      - name: Offline tests (network tests are left out by addopts)
        run: uv run pytest
